name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish the binaries under
        required: true

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
