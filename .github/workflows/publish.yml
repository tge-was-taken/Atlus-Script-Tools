name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the archives to. Leave empty to only upload artifacts.
        type: string
        required: false
        default: ''
      prerelease:
        description: Mark the release as a prerelease.
        type: boolean
        required: false
        default: false
    secrets:
      NUGET_API_KEY:
        description: nuget.org key. Without it the package is only attached to the release.
        required: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-13
          - rid: osx-arm64
            os: macos-latest

    # Native AOT cannot cross compile, so each runtime identifier builds on its own OS.
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The ANTLR grammars are regenerated during the build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Publish the executables
        shell: bash
        run: |
          set -eu
          out="publish/AtlusScriptTools-${{ matrix.rid }}"
          for project in AtlusScriptCompiler \
                         Utilities/AtlusFlowScriptExtractor \
                         Utilities/AtlusMessageScriptExtractor \
                         Utilities/AtlusScriptDocGen \
                         Utilities/DumpMessageIds \
                         Utilities/DumpProcedureIds; do
            dotnet publish "Source/$project/$(basename "$project").csproj" -c Release \
              -r ${{ matrix.rid }} -o "$out"
          done
          rm -rf "$out"/*.pdb "$out"/*.dbg "$out"/*.dsym

      - name: Archive
        shell: bash
        run: |
          set -eu
          cd publish
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "AtlusScriptTools-${{ matrix.rid }}.zip" "AtlusScriptTools-${{ matrix.rid }}"
          else
            zip -r "AtlusScriptTools-${{ matrix.rid }}.zip" "AtlusScriptTools-${{ matrix.rid }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AtlusScriptTools-${{ matrix.rid }}
          path: publish/AtlusScriptTools-${{ matrix.rid }}.zip

      - name: Attach to the release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: publish/AtlusScriptTools-${{ matrix.rid }}.zip

  # The portable build needs an installed .NET runtime but runs anywhere, and the library is
  # packed from the same build for use as a dependency.
  portable:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The ANTLR grammars are regenerated during the build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Work out the package version
        id: version
        shell: bash
        run: |
          set -eu
          version="${{ inputs.tag }}"
          version="${version#v}"
          # A master build is tagged v1.0-<commit>, which is not a version, so number it by run.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            version="1.0.0-ci.${{ github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            && echo "stable=true" >> "$GITHUB_OUTPUT" \
            || echo "stable=false" >> "$GITHUB_OUTPUT"

      - name: Publish the executables
        shell: bash
        run: |
          set -eu
          out=publish/AtlusScriptTools-dotnet
          for project in AtlusScriptCompiler \
                         Utilities/AtlusFlowScriptExtractor \
                         Utilities/AtlusMessageScriptExtractor \
                         Utilities/AtlusScriptDocGen \
                         Utilities/DumpMessageIds \
                         Utilities/DumpProcedureIds; do
            dotnet publish "Source/$project/$(basename "$project").csproj" -c Release \
              -p:PublishAot=false --no-self-contained -o "$out"
          done
          rm -rf "$out"/*.pdb
          cd publish && zip -r AtlusScriptTools-dotnet.zip AtlusScriptTools-dotnet

      - name: Pack the library
        run: |
          dotnet pack Source/AtlusScriptLibrary/AtlusScriptLibrary.csproj -c Release \
            -p:Version=${{ steps.version.outputs.version }} -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg -o publish/nuget

      - uses: actions/upload-artifact@v4
        with:
          name: AtlusScriptTools-dotnet
          path: publish/AtlusScriptTools-dotnet.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AtlusScriptLibrary-nuget
          path: publish/nuget/*

      - name: Attach to the release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            publish/AtlusScriptTools-dotnet.zip
            publish/nuget/*.nupkg

      - name: Push to nuget.org
        if: steps.version.outputs.stable == 'true' && env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push 'publish/nuget/*.nupkg' --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate
