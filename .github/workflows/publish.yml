name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the archives to. Leave empty to only upload artifacts.
        type: string
        required: false
        default: ''
      prerelease:
        description: Mark the release as a prerelease.
        type: boolean
        required: false
        default: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest

    # Native AOT cannot cross compile, so each runtime identifier builds on its own OS.
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The ANTLR grammars are regenerated during the build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Publish the executables
        shell: bash
        run: |
          set -eu
          out="publish/AtlusScriptTools-${{ matrix.rid }}"
          for project in AtlusScriptCompiler \
                         Utilities/AtlusFlowScriptExtractor \
                         Utilities/AtlusMessageScriptExtractor \
                         Utilities/AtlusScriptDocGen \
                         Utilities/DumpMessageIds \
                         Utilities/DumpProcedureIds; do
            dotnet publish "Source/$project/$(basename "$project").csproj" -c Release \
              -r ${{ matrix.rid }} -o "$out"
          done
          rm -rf "$out"/*.pdb "$out"/*.dbg "$out"/*.dsym

      - name: Archive
        shell: bash
        run: |
          set -eu
          cd publish
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "AtlusScriptTools-${{ matrix.rid }}.zip" "AtlusScriptTools-${{ matrix.rid }}"
          else
            zip -r "AtlusScriptTools-${{ matrix.rid }}.zip" "AtlusScriptTools-${{ matrix.rid }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AtlusScriptTools-${{ matrix.rid }}
          path: publish/AtlusScriptTools-${{ matrix.rid }}.zip

      - name: Attach to the release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: publish/AtlusScriptTools-${{ matrix.rid }}.zip

  # The same tools built for the regular .NET runtime instead of native AOT, as self contained
  # single file executables. They are far bigger, but they do not need .NET installed either and
  # they keep working where AOT trimming breaks a reflection based code path.
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest

    # Cross publishing would work here, but macOS rejects arm64 binaries that were not signed on
    # a Mac, so each runtime identifier builds on its own OS as the AOT job does.
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The ANTLR grammars are regenerated during the build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Publish the executables
        shell: bash
        run: |
          set -eu
          out="publish/AtlusScriptTools-dotnet-${{ matrix.rid }}"
          for project in AtlusScriptCompiler \
                         Utilities/AtlusFlowScriptExtractor \
                         Utilities/AtlusMessageScriptExtractor \
                         Utilities/AtlusScriptDocGen \
                         Utilities/DumpMessageIds \
                         Utilities/DumpProcedureIds; do
            dotnet publish "Source/$project/$(basename "$project").csproj" -c Release \
              -r ${{ matrix.rid }} --self-contained -o "$out" \
              -p:PublishAot=false -p:PublishSingleFile=true \
              -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          done
          rm -rf "$out"/*.pdb

      - name: Archive
        shell: bash
        run: |
          set -eu
          cd publish
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "AtlusScriptTools-dotnet-${{ matrix.rid }}.zip" "AtlusScriptTools-dotnet-${{ matrix.rid }}"
          else
            zip -r "AtlusScriptTools-dotnet-${{ matrix.rid }}.zip" "AtlusScriptTools-dotnet-${{ matrix.rid }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AtlusScriptTools-dotnet-${{ matrix.rid }}
          path: publish/AtlusScriptTools-dotnet-${{ matrix.rid }}.zip

      - name: Attach to the release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: publish/AtlusScriptTools-dotnet-${{ matrix.rid }}.zip
