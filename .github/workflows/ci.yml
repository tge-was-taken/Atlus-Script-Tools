name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The ANTLR grammars are regenerated during the build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: dotnet build Source/AtlusScriptTools.sln -c Release

      - run: dotnet test Source/AtlusScriptLibraryTests/AtlusScriptLibraryTests.csproj -c Release --no-build

  # A master build is released as the next 1.1 patch version, with the commit it was built from.
  # Other branches get artifacts but no tag.
  version:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: next
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -eu
          patch=$(git tag --list 'v1.1.*' '1.1.*' \
            | sed -nE 's/^v?1\.1\.([0-9]+).*$/\1/p' | sort -n | tail -1)
          if [ -z "$patch" ]; then patch=-1; fi
          echo "tag=v1.1.$((patch + 1))-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # Downloadable per commit builds for every platform, as the AppVeyor builds used to be.
  binaries:
    needs: version
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.version.outputs.tag }}
