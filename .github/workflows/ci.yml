name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The ANTLR grammars are regenerated during the build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: dotnet build Source/AtlusScriptTools.sln -c Release

      - run: dotnet test Source/AtlusScriptLibraryTests/AtlusScriptLibraryTests.csproj -c Release --no-build

  # Downloadable per commit builds for every platform, as the AppVeyor builds used to be. A
  # master build also gets a release, tagged the way the AppVeyor ones were.
  binaries:
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ github.ref == 'refs/heads/master' && format('v1.0-{0}', github.sha) || '' }}
